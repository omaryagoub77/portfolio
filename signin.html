<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to your Omar portfolio account.">
  <title>Sign in — Omar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <aside class="auth-aside">
    <a class="wordmark" href="index.html">OMAR<span>.</span></a>
    <div class="auth-aside-copy">
      <p class="eyebrow">Your creative space</p>
      <h1>Good to<br>have you<br>back.</h1>
      <p>Sign in to continue your conversations and keep your next project moving.</p>
    </div>
    <p class="auth-aside-foot">Frontend craft / Kigali, Rwanda</p>
  </aside>
  <main class="auth-main">
    <div class="auth-form-wrap">
      <p class="eyebrow">Welcome back</p>
      <h2>Sign in</h2>
      <p class="form-intro">Enter your details to access your account.</p>
      <p class="auth-message" id="auth-message" role="status" aria-live="polite" hidden></p>
      <form class="auth-form" id="signin-form" action="#" method="post">
        <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required></div>
        <div class="field"><label for="password">Password</label><div class="password-input-wrap"><input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required><button class="password-toggle" type="button" aria-label="Show password" aria-controls="password" aria-pressed="false" data-password-toggle><svg class="password-toggle-show" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg><svg class="password-toggle-hide" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16.7 16.7 0 0 1-3.2 4.1M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.8 10.8 0 0 0 4-.8"></path></svg></button></div></div>
        <div class="form-options"><label class="check-label"><input type="checkbox" name="remember"> Remember me</label><button class="auth-inline-button" id="reset-password" type="button">Forgot password?</button></div>
        <button class="button button-dark auth-submit" type="submit">Sign in <span aria-hidden="true">→</span></button>
        <p class="auth-top">New here? <a href="signup.html">Create an account</a></p>
      </form>
      <div class="auth-divider">or</div>
      <p class="back-home"><a href="index.html"><span>←</span> Back to portfolio</a></p>
    </div>
  </main>
  <script type="module" src="js/firebase-auth.js"></script>
</body>
</html>
