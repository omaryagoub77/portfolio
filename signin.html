<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to your Omar portfolio account.">
  <title>Sign in — Omar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <aside class="auth-aside">
    <a class="wordmark" href="index.html">OMAR<span>.</span></a>
    <div class="auth-aside-copy">
      <p class="eyebrow">Your creative space</p>
      <h1>Good to<br>have you<br>back.</h1>
      <p>Sign in to continue your conversations and keep your next project moving.</p>
    </div>
    <p class="auth-aside-foot">Frontend craft / Kigali, Rwanda</p>
  </aside>
  <main class="auth-main">
    <div class="auth-form-wrap">
      <p class="eyebrow">Welcome back</p>
      <h2>Sign in</h2>
      <p class="form-intro">Enter your details to access your account.</p>
      <form class="auth-form" action="#" method="post">
        <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required></div>
        <div class="form-options"><label class="check-label"><input type="checkbox" name="remember"> Remember me</label><a href="mailto:hello@omar.design?subject=Password%20reset">Forgot password?</a></div>
        <button class="button button-dark auth-submit" type="submit">Sign in <span aria-hidden="true">→</span></button>
        <p class="auth-top">New here? <a href="signup.html">Create an account</a></p>
      </form>
      <div class="auth-divider">or</div>
      <p class="back-home"><a href="index.html"><span>←</span> Back to portfolio</a></p>
    </div>
  </main>
</body>
</html>
